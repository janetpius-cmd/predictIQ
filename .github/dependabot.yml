version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /services/tts
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  # Tracks the pinned cargo-audit version used in CI (see CARGO_AUDIT_VERSION
  # in .github/workflows/dependency-scan.yml and .github/workflows/test.yml).
  # Bump the pin deliberately when Dependabot opens a PR here.
  - package-ecosystem: cargo
    directory: /ci/cargo-audit
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
